run:
  overwrite: false
  continue_on_error: true
  final_filename: final.jsonl

backend:
  name: openai_compatible
  base_url: "${OPENAI_BASE_URL}"
  api_key_env: OPENAI_API_KEY
  model: "${FIRAC_MODEL}"
  system_prompt: "You are a careful legal annotation system. Follow the requested schema exactly and return only valid JSON."
  timeout_seconds: 180
  temperature: 0
  max_tokens: 8192
  stream: false
  extra_body: {}

scheduler:
  max_case_concurrency: 4
  max_in_flight_requests: 4
  max_retries: 2
  max_validation_retries: 2
  retry_backoff_seconds: 5

stage_max_tokens:
  metadata_ner: 2048
  issue_analyst: 2048
  legal_researcher: 4096
  logician: 4096
  firac_judge: 8192
  firac_verifier: 4096

prompts:
  metadata_ner: prompts/annotation/v2/metadata_ner.md
  legal_researcher: prompts/annotation/v2/legal_researcher.md
  issue_analyst: prompts/annotation/v2/issue_analyst.md
  logician: prompts/annotation/v2/logician.md
  firac_judge: prompts/annotation/v2/firac_judge.md
  firac_verifier: prompts/annotation/v2/firac_verifier.md

output:
  save_intermediates: false
  save_prompts: false
  write_case_files: true
  log_level: INFO
