backend:
  name: openai_compatible
  base_url: "${OPENAI_BASE_URL}"
  api_key_env: OPENAI_API_KEY
  model: mistral-small-3.2-24b-instruct
  system_prompt: ""
  timeout_seconds: 600
  no_proxy: true
  temperature: 0
  seed: 20260604
  max_tokens: 2048
  stream: true
  extra_body: {}
prompts:
  rule_recommendation: prompts/downstream/v2/rule_candidate_selection.md
scheduler:
  max_case_concurrency: 96
  max_in_flight_requests: 40
  max_retries: 2
  max_validation_retries: 2
  retry_backoff_seconds: 5
  adaptive_throttle:
    enabled: true
    metrics_url: "${VLLM_METRICS_URL}"
    metric_name: "vllm:num_requests_waiting"
    model: mistral-small-3.2-24b-instruct
    no_proxy: true
    min_waiting_requests: 5
    max_waiting_requests: 20
    initial_concurrency: 40
    min_concurrency: 1
    max_concurrency: 96
    additive_increase: 4
    multiplicative_decrease: 0.7
    poll_interval_seconds: 5
max_tokens: 2048
overwrite: false
continue_on_error: true
log_level: INFO
output:
  artifact_store: sqlite
  artifact_store_filename: artifacts.sqlite
  write_case_files: false
