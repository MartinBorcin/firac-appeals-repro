backend:
  name: openai_compatible
  base_url: "${OPENAI_BASE_URL}"
  api_key_env: OPENAI_API_KEY
  model: "${FIRAC_MODEL}"
  system_prompt: "You are an Indian legal expert. Complete the task using only the provided input and return only valid JSON."
  timeout_seconds: 180
  temperature: 0
  max_tokens: 2048
  stream: false
  extra_body: {}

prompts:
  outcome_prediction: prompts/downstream/v1/outcome_prediction.md
  issue_generation: prompts/downstream/v1/issue_generation.md
  rule_recommendation: prompts/downstream/v1/rule_recommendation.md

scheduler:
  max_case_concurrency: 4
  max_in_flight_requests: 4
  max_retries: 2
  max_validation_retries: 2
  retry_backoff_seconds: 5

max_tokens: 2048
overwrite: false
continue_on_error: true
log_level: INFO

evaluation:
  semantic_issue_model: sentence-transformers/paraphrase-MiniLM-L6-v2
  semantic_batch_size: 32

output:
  save_intermediates: false
  write_case_files: true
