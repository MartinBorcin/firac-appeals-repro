backend:
  name: openai_compatible
  base_url: "${OPENAI_BASE_URL}"
  api_key_env: OPENAI_API_KEY
  model: "${FIRAC_MODEL}"
  system_prompt: "You are a strict, careful legal annotation evaluator. Follow the rubric exactly and return only valid JSON."
  timeout_seconds: 180
  temperature: 0
  max_tokens: 4096
  stream: false
  extra_body: {}

scheduler:
  max_case_concurrency: 4
  max_in_flight_requests: 4
  max_retries: 2
  max_validation_retries: 2
  retry_backoff_seconds: 5

max_tokens: 4096
overwrite: false
continue_on_error: true
log_level: INFO

output:
  save_intermediates: false
  write_case_files: true
