[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firac-appeals-repro"
version = "0.1.0"
description = "Minimal reproducibility package for FIRAC Appeals annotation and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "openai>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rouge-score>=0.1.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
eval = [
  "bert-score==0.3.4",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
]

[project.scripts]
firac-prepare-cases = "firac_appeals.cli.prepare_cases:main"
firac-load-source = "firac_appeals.cli.load_source:main"
firac-annotate = "firac_appeals.cli.annotate:main"
firac-split-temporal = "firac_appeals.cli.split_temporal:main"
firac-build-tasks = "firac_appeals.cli.build_tasks:main"
firac-run-baseline = "firac_appeals.cli.run_baseline:main"
firac-run-llm-eval = "firac_appeals.cli.run_llm_eval:main"
firac-score-predictions = "firac_appeals.cli.score_predictions:main"
firac-score-summaries = "firac_appeals.cli.score_summaries:main"
firac-run-rubric = "firac_appeals.cli.run_rubric:main"
firac-compare-rubric = "firac_appeals.cli.compare_rubric:main"
firac-make-results = "firac_appeals.cli.make_results:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
