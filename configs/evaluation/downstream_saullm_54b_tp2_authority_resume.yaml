backend:
  name: openai_compatible
  base_url: "${OPENAI_BASE_URL}"
  api_key_env: OPENAI_API_KEY
  model: saullm-54b-instruct
  system_prompt: ""
  timeout_seconds: 600
  no_proxy: true
  temperature: 0
  seed: 20260604
  max_tokens: 2048
  stream: true
  structured_output: true
  extra_body: {}
prompts:
  outcome_prediction: prompts/downstream/v2/outcome_prediction_binary.md
  issue_generation: prompts/downstream/v1/issue_generation.md
  rule_recommendation: prompts/downstream/v1/rule_recommendation.md
scheduler:
  max_case_concurrency: 64
  max_in_flight_requests: 24
  thread_pool_workers: 96
  max_retries: 2
  max_validation_retries: 2
  retry_backoff_seconds: 5
  adaptive_throttle:
    enabled: true
    metrics_url: "${VLLM_METRICS_URL}"
    metric_name: "vllm:num_requests_waiting"
    model: saullm-54b-instruct
    no_proxy: true
    min_waiting_requests: 3
    max_waiting_requests: 15
    initial_concurrency: 24
    min_concurrency: 1
    max_concurrency: 64
    additive_increase: 3
    multiplicative_decrease: 0.7
    poll_interval_seconds: 5
max_tokens: 2048
overwrite: false
continue_on_error: true
log_level: INFO
evaluation:
  outcome_labels: [allowed, dismissed]
output:
  artifact_store: sqlite
  artifact_store_filename: artifacts.sqlite
  write_case_files: false
